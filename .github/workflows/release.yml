name: Build and Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Read version and verify it matches the tag
      shell: bash
      run: |
        VERSION=$(python -c "import re; print(re.search(r'CURRENT_VERSION = \"(.+?)\"', open('core/config.py', encoding='utf-8').read()).group(1))")
        echo "core/config.py: $VERSION, ref: $GITHUB_REF_NAME"
        if [[ "$GITHUB_REF" == refs/tags/v* && "v$VERSION" != "$GITHUB_REF_NAME" ]]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match CURRENT_VERSION v$VERSION"
          exit 1
        fi
        echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build app with PyInstaller (one folder)
      run: >
        pyinstaller --noconfirm --onedir --windowed
        --name ImageEditor
        --icon icon.ico --add-data "icon.ico;."
        main.py

    - name: Install Inno Setup if missing
      shell: pwsh
      run: |
        $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }

    - name: Build installer
      shell: pwsh
      run: |
        & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" inno.iss
        if (-not (Test-Path Output\ImageEditor_Setup.exe)) { throw "Installer was not created" }

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ImageEditor-Setup
        path: Output/ImageEditor_Setup.exe

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" Output/ImageEditor_Setup.exe --title "$GITHUB_REF_NAME" --generate-notes
