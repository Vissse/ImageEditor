name: Build and Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Verify tag matches CURRENT_VERSION
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: |
        VERSION=$(python -c "import re; print(re.search(r'CURRENT_VERSION = \"(.+?)\"', open('core/config.py', encoding='utf-8').read()).group(1))")
        echo "core/config.py: $VERSION, tag: $GITHUB_REF_NAME"
        if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match CURRENT_VERSION v$VERSION"
          exit 1
        fi

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build with PyInstaller
      run: >
        pyinstaller --noconfirm --onefile --windowed
        --name PhotoBatchEditor --collect-all PySide6
        --icon icon.ico --add-data "icon.ico;."
        main.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: PhotoBatchEditor-Windows-EXE
        path: dist/PhotoBatchEditor.exe

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" dist/PhotoBatchEditor.exe --title "$GITHUB_REF_NAME" --generate-notes
